# Bagian yang disesuaikan pada /etc/freeradius/3.0/mods-available/ldap
ldap {
    server   = 'ldap://127.0.0.1'
    identity = 'cn=admin,dc=utamadigital,dc=co,dc=id'
    password = 'GANTI_SANDI_ADMIN_LDAP'
    base_dn  = 'ou=Guests,dc=utamadigital,dc=co,dc=id'

    user {
        base_dn = "${..base_dn}"
        filter  = "(uid=%{%{Stripped-User-Name}:-%{User-Name}})"
    }
}
