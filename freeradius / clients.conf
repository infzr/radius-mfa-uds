# =============================================================
#  /etc/freeradius/3.0/clients.conf
#  Klien RADIUS: Router Cisco R1-UDS
# =============================================================
client localhost {
    ipaddr    = 127.0.0.1
    secret    = testing123
    shortname = localhost
    nas_type  = other
}

client R1-UDS {
    ipaddr                        = 192.168.10.1
    secret                        = Rad1us!UDS#2026
    shortname                     = R1-UDS
    nas_type                      = cisco
    require_message_authenticator = yes
}
